on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: file_changes
        uses: trilom/file-changes-action@ce38c8ce2459ca3c303415eec8cb0409857b4272
        with:
          output: 'json'
          fileOutput: 'json'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Reject dependency manifest changes
        env:
          FILES_MODIFIED: ${{ steps.file_changes.outputs.files_modified }}
        run: |
          set -euo pipefail
          if [[ "$FILES_MODIFIED" == *"package.json"* || "$FILES_MODIFIED" == *"package-lock.json"* ]]; then
            echo "Dependency manifest changes are not accepted in adapter pull requests" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run changed files through test script
        env:
          LLAMA_DEBUG_MODE: 'true'
          MODIFIED_FILES: ${{ steps.file_changes.outputs.files_modified }}
          ADDED_FILES: ${{ steps.file_changes.outputs.files_added }}
          FILES_MODIFIED: ${{ steps.file_changes.outputs.files_modified }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t RUN_FILES < <(
            MODIFIED="$MODIFIED_FILES" \
            ADDED="$ADDED_FILES" \
            node "$GITHUB_WORKSPACE/.github/workflows/getFileList.js" \
              | node -e 'for (const file of JSON.parse(require("fs").readFileSync(0, "utf8"))) console.log(file)'
          )

          if [ "${#RUN_FILES[@]}" -eq 0 ]; then
            echo "No adapter files were modified"
            exit 0
          fi

          for adapter_path in "${RUN_FILES[@]}"; do
            output_file="$RUNNER_TEMP/output.txt"
            node "$GITHUB_WORKSPACE/test.js" "$GITHUB_WORKSPACE/$adapter_path" 2>&1 | tee "$output_file"
            GITHUB_TOKEN="$GITHUB_TOKEN" node "$GITHUB_WORKSPACE/.github/workflows/commentResult.js" \
              "$output_file" "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ github.event.number }}" "$adapter_path"
            if grep -q -- "---- ERROR ----" "$output_file"; then
              exit 1
            fi
          done

      - name: Run ESLint
        run: npm run lint
